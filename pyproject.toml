[project]
name = "jevscholar"
version = "0.1.0"
description = "Budget-aware deep research agent and evaluation harness (DeepScholar-Bench, ResearchQA, DRB2)."
requires-python = "==3.12.*"            # LOTUS @4665619 requires >=3.10,<3.13
dependencies = [
    "aiohttp>=3.12,<4",                 # LLM gateway (server + upstream client)
    "bm25s>=0.2",                       # local arXiv BM25 index (fallback backend)
    "numpy>=1.26",
    "openai>=2.45,<3",                  # every litellm release and openai-agents 0.20 need openai 2.x
    "pandas>=2.2,<3",
    "pyarrow>=15",                      # arXiv metadata snapshot (parquet)
    "pydantic>=2.11,<3",
    "pypdf>=5",                         # DRB2 reference reports (pdf -> text) for judge calibration
    "python-docx>=1.1",                 # DRB2 evaluator reads .docx reports
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.32",                   # search backends; vendored DRB2 client
    "scipy>=1.11",                      # t-intervals in analysis
    "tenacity>=9.0",
    "typer>=0.15",
]

[project.scripts]
jev = "jevscholar.cli:app"

[dependency-groups]
# DeepScholar-base generation + DeepScholar-Bench evaluation (third_party/deepscholar @ c95413b).
deepscholar = [
    "lotus-ai[arxiv]",                  # git rev in [tool.uv.sources]; [file_extractor] is never imported
    "openai-agents==0.20.0",            # last release on openai 2.x; DeepScholar's private imports verified
    "litellm>=1.83,<2",                 # first post-incident line (1.82.7-1.82.9 were compromised)
    "arxiv>=2.2,<3",                    # client of DeepScholar's era (3.x/4.x replaced the feed parser)
    "nuggetizer",                       # vendored eval/nuggetizer 0.0.6 (not on PyPI)
    "nltk>=3.9.1",                      # sent_tokenize needs the punkt_tab resource
    "beautifulsoup4>=4.12",
    "pillow",                           # `import lotus` imports PIL, LOTUS does not declare it
    "tabulate>=0.9",
]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.13",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12"
default-groups = ["deepscholar", "dev"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
exclude-newer = "2026-10-01T00:00:00Z"  # ~2 weeks before lock day; bump deliberately

[tool.uv.sources]
lotus-ai = { git = "https://github.com/lotus-data/lotus.git", rev = "4665619fd133d256190993127ded1f22f71659ce" }
nuggetizer = { path = "third_party/deepscholar/eval/nuggetizer", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # CJK punctuation in prompts/tests is intentional

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not network and not gpu'"
asyncio_mode = "auto"
markers = [
    "network: calls real external APIs (opt in with -m network)",
]
