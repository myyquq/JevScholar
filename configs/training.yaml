# d1-3B training recipes (`jev controller train NAME`, in .venv-train). Paths are relative to the
# repository; unset fields take controller/d1.py's TrainConfig defaults (LoRA r 16, alpha 32,
# dropout 0.05; warmup 5%; prompts over 7,552 tokens dropped).
sanity:  # the training-loop check: a paper's primary arXiv category among four
  train: data/derived/controller/sanity/train.jsonl  # `jev controller sanity-data`
  dev: data/derived/controller/sanity/dev.jsonl
  out: runs/controller/sanity
  epochs: 2
  lr: 2.0e-4
  batch_tokens: 8192
  accum: 4
  eval_every: 100  # 400 dev rows: evaluate every 100 optimiser steps
sft:  # the supervised warm start on counterfactual branch labels (docs/06)
  train: data/derived/controller/sft/train.jsonl  # `jev controller labels` of train branch runs
  dev: data/derived/controller/sft/dev.jsonl  # ... of val branch runs
  dev_points: data/derived/controller/sft/dev.points.jsonl  # their returns: select by regret
  out: runs/controller/sft
  epochs: 2
  lr: 5.0e-5
  schedule: constant
  warmup: 0.0  # one warmup step
  batch_tokens: 8192
  accum: 1
  seed: 0
sft_fixed:  # the supervised start on fixed-rule branches, best-option targets (docs/06)
  train: data/derived/controller/sft_fixed/train.jsonl  # `jev controller labels --targets best`
  dev: data/derived/controller/sft_fixed/dev.jsonl  # ... of val branch runs: select by dev CE
  out: runs/controller/sft_fixed
  epochs: 2
  lr: 2.0e-4
  batch_tokens: 8192
  accum: 4
  eval_every: epoch  # keep and score the adapter at each epoch's end
rl1:  # the registered RL round (docs/06): its points are frozen before any rollout
  kind: rl
  source: ctl-train-d1
  system: ctl_d1
  points:  # `jev controller rl-points ctl-train-d1`
    - [2505.22167v1, 4]
    - [2505.24203v1, 3]
    - [2504.06975v1, 4]
    - [2504.21752v1, 4]
    - [2506.00958v1, 3]
    - [2505.24754v1, 3]
    - [2505.21811v1, 5]
    - [2505.22757v1, 5]
  samples: 4
  prefix: rl1
  run_usd: 0.5
  steps: data/derived/controller/rl/rl1.jsonl  # `jev controller rl-data rl1`
  out: runs/controller/rl1
  init_adapter: runs/controller/sft/adapter  # d1-sft, which the rollouts sample from
  reference: runs/controller/sft/adapter
  lr: 2.0e-5
  optimizer_steps: 4
  groups_per_step: 2
  seed: 0
screen:  # d1 as the relevance screener on DeepSeek's verdicts (docs/07_screener.md)
  train: data/derived/controller/screen/train.jsonl  # `jev controller screen-data`: train tasks
  dev: data/derived/controller/screen/val.jsonl  # val tasks choose the step; June dev is held out
  out: runs/controller/screen
  epochs: 2
  lr: 2.0e-4
  batch_tokens: 8192
  accum: 4
  eval_every: 100  # about one epoch (3,143 verdicts, about 94 steps): steps 0, 100 and the last
