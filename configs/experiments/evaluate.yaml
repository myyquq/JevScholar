# The main comparison on DeepScholar-Bench: the same executor, search and output limits for every
# system, the controllers capped at B0 = $0.27 per task and DS-base at its natural cost, two
# independent writer samples per task (docs/04, docs/06). Serve d1 first:
# `scripts/train_env.sh jev controller serve`.
budget: {run_usd: 4.0, judge_run_usd: 2.0}
systems:
  dsb_d1_30:  # DS-base with d1 as its filter step: d1 screens the pool and its P ranks the
    extends: deepscholar_base_intro  # relevant papers to the writer's 30; the search agent's own
    screen: {threshold: 0.2942}  # draft is kept (its search replays DS-base's)
  dsb_d1_dr: {extends: dsb_d1_30, draft_docs: true}  # ... the pool papers its draft names first
  dsb_d1_dr_cr:  # DraftRef whose writer ends a sentence where its source changes: cite_p judges
    extends: dsb_d1_dr  # every citation against its whole sentence
    cite_rule: >-
      - Cite every source at least once, and end a sentence where its source changes: do not join
      points from different sources in one sentence (with 'and', 'while', a semicolon or a
      comma-separated list), even where the existing section content does; split such sentences,
      keeping every point with its citation. Cite several sources in one sentence only if each one
      supports the whole sentence.
benchmarks:
  deepscholar:
    samples: 2
    systems: [deepscholar_base_intro, simple_rag_k20, ctl_fixed, ctl_d1, ctl_prompted]

variants:
  dev: {benchmarks: {deepscholar: {split: dev, limit: 20}}}     # June dev
  dev2: {benchmarks: {deepscholar: {split: dev2, limit: 20}}}   # Nov dev2
  test:  # the final test's first 90 tasks: every arm (docs/06); serve d1, d1-sft and d1-rl first
    budget: {run_usd: 25.0, judge_run_usd: 10.0}
    benchmarks:
      deepscholar:
        split: test
        limit: 90
        systems: [deepscholar_base_intro, ctl_d1, ctl_d1_sft, ctl_d1_rl, ctl_fixed, ctl_fixed_6,
                  simple_rag_k20, deepscholar_base_intro_nobg]
  test-ext:  # the other 90 test tasks: DS-base and the main claim's d1 (docs/06)
    budget: {run_usd: 12.0, judge_run_usd: 4.0}
    benchmarks:
      deepscholar:
