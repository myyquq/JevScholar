    budget: {run_usd: 2.0, judge_run_usd: 3.0}  # search replays eval-test's and eval-test-ext's
    benchmarks: {deepscholar: {split: test, samples: 4, systems: [dsb_d1_30]}}
  test-closed:  # the closed-book reference row on the first 90 test tasks, one sample
    budget: {run_usd: 1.0, judge_run_usd: 1.0}
