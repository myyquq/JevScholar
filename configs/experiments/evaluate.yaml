# The main comparison on DeepScholar-Bench: the same executor, search and output limits for every
# system, the controllers capped at B0 = $0.27 per task and DS-base at its natural cost, two
# independent writer samples per task (docs/04, docs/06). Serve d1 first:
# `scripts/train_env.sh jev controller serve`.
budget: {run_usd: 4.0, judge_run_usd: 2.0}
benchmarks:
  deepscholar:
    samples: 2
    systems: [deepscholar_base_intro, simple_rag_k20, ctl_fixed, ctl_d1, ctl_prompted]

systems:  # the trained d1 (docs/06), each adapter on its own server, named by its sha256
  ctl_d1_sft:  # d1-sft: runs/controller/sft/adapter
    extends: ctl_d1
    policy:
      url: http://127.0.0.1:9941
      adapter: dabf7875e4091468400e50fa90a67c54d2dbce7969ac73d97df05280d03c45b6
  ctl_d1_rl:  # d1-rl: runs/controller/rl/first/r1/adapter
    extends: ctl_d1
    policy:
      url: http://127.0.0.1:9942
      adapter: 2fa87a6904389d5d0503cd46f5aaf0fe91107a7231ce753e4c30fa5256f79807
  # the fixed rule at larger budgets (ctl_fixed: 3 batches): its cost-quality curve, against
  # which the d1 controllers are compared at matched cost (`jev controller frontier`)
  ctl_fixed_b4: {extends: ctl_fixed, policy: {batches: 4}}
  ctl_fixed_b5: {extends: ctl_fixed, policy: {batches: 5}}
  ctl_fixed_b6: {extends: ctl_fixed, policy: {batches: 6}}
  # d1 as the relevance screener (docs/06: screening): runs/controller/screen/adapter, at the
  # delta chosen on val; the money it saves buys more batches (scripts/screen_dev.sh)
  ctl_screen:
    extends: ctl_fixed
    screener:
      url: http://127.0.0.1:9943
      adapter: 0ec04682ed2c880a34e279f24df0d121671629a0a0d7e8274425fa4fddfb502e
      delta: 0.7
  ctl_screen_b4: {extends: ctl_screen, policy: {batches: 4}}
  ctl_screen_b5: {extends: ctl_screen, policy: {batches: 5}}
  ctl_screen_b6: {extends: ctl_screen, policy: {batches: 6}}
  ctl_screen_b8: {extends: ctl_screen, max_batches: 8, policy: {batches: 8}}

variants:
  dev: {benchmarks: {deepscholar: {split: dev, limit: 20}}}     # June dev
  dev-trained:  # June dev: choose the d1 of the main claim (docs/06); scripts/june_dev.sh
    benchmarks:
      deepscholar:
        split: dev
        limit: 20
        systems: [ctl_fixed, ctl_d1, ctl_d1_sft, ctl_d1_rl,
                  ctl_fixed_b4, ctl_fixed_b5, ctl_fixed_b6]
  dev-screen:  # June dev: the screened fixed rule against the fixed curve; scripts/screen_dev.sh
    benchmarks:
      deepscholar:
        split: dev
        limit: 20
        systems: [ctl_fixed, ctl_fixed_b4, ctl_fixed_b5, ctl_fixed_b6,
                  ctl_screen, ctl_screen_b4, ctl_screen_b5, ctl_screen_b6, ctl_screen_b8]
  dev2-screen:  # Nov dev2: the same comparison on 20 new tasks (scripts/screen_dev.sh, VARIANT)
    benchmarks:
      deepscholar:
        split: dev2
        limit: 20
        systems: [ctl_fixed, ctl_fixed_b4, ctl_fixed_b5, ctl_fixed_b6,
                  ctl_screen, ctl_screen_b4, ctl_screen_b5, ctl_screen_b6]
  dev2: {benchmarks: {deepscholar: {split: dev2, limit: 20}}}   # Nov dev2
  test:  # the held-out tasks; the trained controllers join once frozen
    budget: {run_usd: 15.0, judge_run_usd: 5.0}
    benchmarks:
      deepscholar:
        split: test
        limit: 90
        systems: [deepscholar_base_intro, simple_rag_k20, ctl_fixed, ctl_d1,
                  deepscholar_base_intro_nobg]
  replay:  # $0 check: the baselines regenerate from the replay cache, byte-identical
    replay_only: true
    offpeak_only: false
    benchmarks:
      deepscholar:
        split: dev
        limit: 20
        samples: 1
        systems: [deepscholar_base_intro, simple_rag_k20]
