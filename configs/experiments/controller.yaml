# The controlled loop on the June train and validation tasks (docs/05, docs/06): a smoke check of
# every policy, the fixed rule's and untrained d1's train episodes (the states the writing and
# reading pilots, and d1's branch labels and RL points, start from), selection on val, and the val
# gate. Serve d1 first: `scripts/train_env.sh jev controller serve`.
budget: {run_usd: 1.0, judge_run_usd: 0.4}

systems:
  ctl_fixed_3: {extends: ctl_fixed, policy: {batches: 3}}  # the fixed rule at 3 batches
  ctl_keyword:  # keyword searches and their next pages in turn
    extends: ctl_fixed
    actions: [explore, deepen]
    policy: {retrieval: [explore, deepen]}

variants:
  smoke:  # two train tasks through every policy
    workers: 2
    budget: {run_usd: 0.3, judge_run_usd: 0.1}
    benchmarks:
      deepscholar:
        split: train
        limit: 2
        systems: [ctl_fixed_3, ctl_keyword, ctl_d1, ctl_prompted]
  rollouts:  # the fixed rule on all 34 train tasks (rollouts-train; rollouts-val on the 9 val
    benchmarks:  # tasks: --set benchmarks.deepscholar.split=val)
      deepscholar: {split: train, systems: [ctl_fixed]}
  rollouts_d1:  # untrained d1 on all 34 train tasks: the states its branch labels start from
    benchmarks:
      deepscholar: {split: train, systems: [ctl_d1]}
  val:  # selection on the 9 validation tasks: the fixed rule's batch count; d1 and the prompted
    benchmarks:  # executor measured alongside
      deepscholar:
        split: val
        systems: [ctl_fixed_3, ctl_fixed_6, ctl_d1, ctl_prompted]
  gate:  # the val gate (docs/06): d1, d1-sft and d1-rl, two writer samples each; d1's episodes
    benchmarks:  # replay ctl-val's from the cache. Serve d1-sft and d1-rl on their ports first.
      deepscholar:
        split: val
        samples: 2
        systems: [ctl_d1, ctl_d1_sft, ctl_d1_rl]
