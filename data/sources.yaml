# Every external file JevScholar reads, pinned by revision and sha256 (`jev data fetch`).
# A blank sha256 is refused; `jev data fetch --pin` trusts it on first use: it computes the
# digest and writes it back.
# Archive entries: `extract` maps a path inside the archive (top-level folder stripped; a trailing
# "/" selects a whole directory) to a destination under data/raw/. File entries: `files` maps a
# path relative to `url` to its sha256, saved under data/raw/<dest>.
# data/raw/ is never committed (licences: DeepScholar MIT, DRB2 data CC BY 4.0 / CC BY-NC 4.0 for
# idx 26 and 110, ResearchQA data MIT, ResearchQA code unlicensed, DRB2 reports Apache-2.0).

